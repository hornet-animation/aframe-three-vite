<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hornet Holiday Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes snowfall {
      0% { transform: translateY(-10vh) translateX(0); opacity: 1; }
      100% { transform: translateY(100vh) translateX(100px); opacity: 0; }
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #0f2240 0%, #1a4d6d 50%, #2d5a7b 100%);
      color: #fff;
      font-family: "Georgia", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(255,255,255,.5)),
        radial-gradient(2px 2px at 60px 70px, #fff, rgba(255,255,255,.3)),
        radial-gradient(1px 1px at 50px 50px, #fff, rgba(255,255,255,.2));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: sparkle 3s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.5;
    }

    .snowflakes { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .snowflake { position: absolute; top: -10vh; color: #fff; font-size: 1.5em; opacity: 0.8; animation: snowfall linear infinite; text-shadow: 0 0 5px rgba(255,255,255,0.5); }

    h1 { font-size: 3.5em; text-align: center; padding: 1.5em 1em 0.5em; text-shadow: 3px 3px 6px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.2); z-index: 10; letter-spacing: 2px; font-weight: normal; }
    .tagline { text-align: center; font-size: 1.3em; color: #e0f0ff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin-bottom: 1.5em; z-index: 10; letter-spacing: 1px; }

    .container { display: flex; flex: 1; gap: 3em; padding: 2em; align-items: center; justify-content: center; max-width: 1400px; margin: 0 auto; width: 100%; position: relative; z-index: 5; }

    .left-section, .right-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5em;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 2.5em;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: gentleSway 4s ease-in-out infinite;
    }

    .right-section { animation-delay: 0.5s; }

    .section-title { font-size: 2em; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.4); letter-spacing: 1px; color: #fff; }

    .qr-container { background: white; padding: 1.8em; border-radius: 15px; box-shadow: 0 12px 30px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.1); border: 3px solid #e8f4f8; animation: gentleSway 5s ease-in-out infinite; }

    .qr-container img { max-width: 220px; width: 100%; display: block; border-radius: 5px; }

    .marker-container img { max-width: 450px; width: 100%; border-radius: 15px; box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 30px rgba(100,200,255,0.2); border: 3px solid rgba(255,255,255,0.3); animation: gentleSway 5.5s ease-in-out infinite; transition: transform 0.3s ease; }
    .marker-container img:hover { transform: scale(1.02); }

    .decoration { font-size: 2.5em; opacity: 0.6; margin: 0.5em 0; }

    @media (max-width: 768px) {
      h1 { font-size: 2.5em; }
      .container { flex-direction: column; gap: 2em; padding: 1em; }
      .left-section, .right-section { width: 100%; padding: 2em; }
      .section-title { font-size: 1.6em; }
      .marker-container img { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="snowflakes" id="snowflakes"></div>
  
  <h1>✨ Happy Holidays ✨</h1>
  <div class="tagline">from Hornet</div>

  <div class="container">
    <div class="left-section">
      <div class="decoration">❄️</div>
      <div class="section-title">Scan Me!</div>
      <div class="qr-container">
        <!-- Use relative paths -->
        <img src="marker/pattern-star-dude.png" alt="QR Code to launch AR" />
      </div>
      <div class="decoration">⛄</div>
    </div>

    <div class="right-section">
      <div class="decoration">🎄</div>
      <div class="section-title">Point Camera Here!</div>
      <div class="marker-container">
        <img src="marker/pattern-star-dude.png" alt="AR Marker" />
      </div>
      <div class="decoration">⭐</div>
    </div>
  </div>

  <script>
    // Create snowflakes
    const snowflakesContainer = document.getElementById('snowflakes');
    const snowflakeSymbols = ['❄', '✦', '❋', '✧'];
    
    for (let i = 0; i < 30; i++) {
      const snowflake = document.createElement('div');
      snowflake.className = 'snowflake';
      snowflake.textContent = snowflakeSymbols[Math.floor(Math.random() * snowflakeSymbols.length)];
      snowflake.style.left = Math.random() * 100 + '%';
      snowflake.style.animationDuration = (5 + Math.random() * 5) + 's';
      snowflake.style.animationDelay = Math.random() * 2 + 's';
      snowflake.style.fontSize = (0.8 + Math.random() * 1.2) + 'em';
      snowflakesContainer.appendChild(snowflake);
    }
  </script>
</body>
</html>
