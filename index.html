<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hornet Holiday Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes snowfall {
      0% { transform: translateY(-10vh) translateX(0); opacity: 1; }
      100% { transform: translateY(100vh) translateX(100px); opacity: 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 40px rgba(100,200,255,0.2); }
      50% { box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 60px rgba(100,200,255,0.4); }
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #0f2240 0%, #1a4d6d 50%, #2d5a7b 100%);
      color: #fff;
      font-family: "Georgia", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(255,255,255,.5)),
        radial-gradient(2px 2px at 60px 70px, #fff, rgba(255,255,255,.3)),
        radial-gradient(1px 1px at 50px 50px, #fff, rgba(255,255,255,.2));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: sparkle 3s ease-in-out infinite;
      pointer-events: none;
      opacity: 0.5;
    }

    .snowflakes { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
    .snowflake { position: absolute; top: -10vh; color: #fff; font-size: 1.5em; opacity: 0.8; animation: snowfall linear infinite; text-shadow: 0 0 5px rgba(255,255,255,0.5); }

    h1 { 
      font-size: 3.5em; 
      text-align: center; 
      padding: 1em 1em 0.3em; 
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.2); 
      z-index: 10; 
      letter-spacing: 3px; 
      font-weight: 300; 
      position: relative;
      animation: float 6s ease-in-out infinite;
    }
    .tagline { 
      text-align: center; 
      font-size: 1.3em; 
      color: #e0f0ff; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3); 
      
      z-index: 10; 
      letter-spacing: 3px; 
      position: relative;
      font-weight: 300;
      text-transform: uppercase;
      font-size: 1em;
    }

    .container { 
      display: flex; 
      flex: 1; 
      gap: 2em; 
      padding: 2em; 
      align-items: center; 
      justify-content: center; 
      max-width: 1600px; 
      margin: 0 auto; 
      width: 100%; 
      position: relative; 
      z-index: 5; 
    }

    .left-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3em;
      padding: 3em 2em;
      flex: 0 0 auto;
      max-width: 350px;
    }

    .right-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      padding: 0;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      flex: 1;
      min-width: 600px;
      overflow: hidden;
      animation: glow 4s ease-in-out infinite;
    }

    .section-title { 
      font-size: 1.2em; 
      font-weight: 300; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.4); 
      letter-spacing: 2px; 
      color: #fff; 
      text-transform: uppercase;
    }

    .qr-container { 
      background: white; 
      padding: 1.2em; 
      border-radius: 20px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
      border: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .qr-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 50px rgba(0,0,0,0.6);
    }

    .qr-container img { 
      max-width: 160px; 
      width: 100%; 
      display: block; 
      border-radius: 10px; 
    }

    .marker-container img { 
      max-width: 260px; 
      width: 100%; 
      border-radius: 20px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
      border: 1px solid rgba(255,255,255,0.2); 
      transition: transform 0.3s ease, box-shadow 0.3s ease; 
    }
    .marker-container img:hover { 
      transform: translateY(-5px) scale(1.02); 
      box-shadow: 0 15px 50px rgba(0,0,0,0.6), 0 0 40px rgba(100,200,255,0.3);
    }

    .decoration { 
      font-size: 2.5em; 
      opacity: 0.5;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
    }

    #model-viewer { 
      width: 100%; 
      height: 800px; 
      border-radius: 15px; 
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4), inset 0 0 30px rgba(100,200,255,0.1);
      border: 3px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.3);
    }

    @media (max-width: 1024px) {
      .container { flex-direction: column; align-items: center; }
      .right-section { min-width: auto; width: 100%; max-width: 600px; }
      .left-section { max-width: 100%; width: 100%; }
    }

    @media (max-width: 768px) {
      h1 { font-size: 2.5em; }
      .container { gap: 2em; padding: 1em; }
      .left-section, .right-section { padding: 2em; }
      .section-title { font-size: 1.6em; }
      #model-viewer { height: 400px; }
    }
  </style>
</head>
<body>
  <div class="snowflakes" id="snowflakes"></div>
  
  <h1>✨ Happy Holidays ✨</h1>
  <div class="tagline">from Hornet</div>

  <div class="container">
    <div class="left-section">
      <div class="decoration">❄️</div>
      <div class="section-title">Scan Me!</div>
      <div class="qr-container">
        <img src="assets/qr-code.png" alt="QR Code to launch AR" />
      </div>
      
      <div class="decoration">⛄</div>
      <div class="section-title">Point Camera Here!</div>
      <div class="marker-container">
        <img src="assets/pattern-star-dude.png" alt="AR Marker" />
      </div>
      <div class="decoration">⭐</div>
    </div>

    <div class="right-section">
      <div class="viewer-header">
        <div class="decoration"> .</div>
        <div class="section-title">Model Viewer</div>
      </div>
      <div id="model-viewer"></div>
    </div>
  </div>

  <script>
    // Create snowflakes
    const snowflakesContainer = document.getElementById('snowflakes');
    const snowflakeSymbols = ['❄', '✦', '⋆', '✧'];
    
    for (let i = 0; i < 30; i++) {
      const snowflake = document.createElement('div');
      snowflake.className = 'snowflake';
      snowflake.textContent = snowflakeSymbols[Math.floor(Math.random() * snowflakeSymbols.length)];
      snowflake.style.left = Math.random() * 100 + '%';
      snowflake.style.animationDuration = (5 + Math.random() * 5) + 's';
      snowflake.style.animationDelay = Math.random() * 2 + 's';
      snowflake.style.fontSize = (0.8 + Math.random() * 1.2) + 'em';
      snowflakesContainer.appendChild(snowflake);
    }
  </script>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
