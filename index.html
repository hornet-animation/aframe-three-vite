<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hornet Holiday Card 2025</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #logo {
        position: fixed;
        bottom: 40px;
        left: 40px;
        z-index: 1000;
        width: 200px;
        height: auto;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #logo.visible {
        opacity: 1;
      }
      
      /* Splash Screen Styles */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: all;
      }
      
      #splash-screen.hidden {
        pointer-events: none;
      }
      
      .curtain {
        position: absolute;
        left: 0;
        width: 100%;
        height: 55%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        background-image: url('your_background_image.jpg');
        transition: transform 1.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 2;
      }
      
      .curtain-left {
        top: -5%;
        transform: translateY(0);
      }
      
      .curtain-right {
        bottom: -5%;
        transform: translateY(0);
      }
      
      #splash-screen.opening .curtain-left {
        transform: translateY(-100%);
      }
      
      #splash-screen.opening .curtain-right {
        transform: translateY(100%);
      }
      
      .splash-content {
        position: relative;
        z-index: 3;
        text-align: center;
        color: white;
        transition: opacity 0.3s ease;
      }
      
      #splash-screen.opening .splash-content {
        opacity: 0;
      }
      
      .splash-title {
        font-family: 'Arial', sans-serif;
        font-size: 2.5rem;
        font-weight: bold;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      }
      
      .tap-button {
        display: inline-block;
        padding: 15px 40px;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid white;
        border-radius: 50px;
        color: white;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        animation: pulse 2s infinite;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      
      .tap-button:active {
        transform: scale(0.95);
        background: rgba(255, 255, 255, 0.3);
      }
      
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      
      .tap-instruction {
        margin-top: 10px;
        font-size: 0.9rem;
        opacity: 0.8;
      }
      
      .instruction-text {
        margin-bottom: 30px;
        font-size: 1rem;
        opacity: 0.9;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
      <div class="splash-content">
        <h1 class="splash-title">Happy Holidays</h1>
        <p class="instruction-text">Tap to start and point your camera at the target image</p>
        <div class="tap-button" id="start-button">START</div>
      </div>
    </div>
    
    <img id="logo" src="assets/hornet-logo.svg" alt="Logo">
    <a-scene embedded arjs="sourceType: webcam;">

      <!-- vertical surfaces (screen/wall) -->
      <a-marker preset='custom' type='pattern' url='assets/pattern-star-render.patt'>
        <a-entity
          gltf-model="assets/giftbox08.glb"
          position="0 0 0"
          scale="6 6 6"
          rotation="-90 0 0"
          animation-mixer="clip: *; loop: repeat; timeScale: 0"
          fix-materials
          class="train-model">
          <!--<a-entity id="animated-frames" position="0.7 -0.1 0" scale="1 1 1" rotation="0 0 0"></a-entity> -->
        </a-entity>
      </a-marker>

      <!-- horizontal surfaces (table) -->
      <a-marker preset='custom' type='pattern' url='assets/pattern-star-blue.patt'>
        <a-entity
          gltf-model="assets/giftbox08.glb"
          position="0 0 0"
          scale="3 3 3"
          rotation="0 0 0"
          animation-mixer="clip: *; loop: repeat; timeScale: 0"
          fix-materials
          class="train-model">
        </a-entity>
      </a-marker>
 
      <a-entity camera></a-entity>
    </a-scene>
    <script>

      // Component to cycle through animation frames (dynamically loaded)
      AFRAME.registerComponent('frame-animator', {
        schema: {
          fps: { type: 'number', default: 30 },
          totalFrames: { type: 'number', default: 30 }, 
          folderPath: { type: 'string', default: 'assets/background-moving-frames/' },
          framePrefix: { type: 'string', default: 'frame_' },
          offsetX: { type: 'number', default: 0 },
          offsetY: { type: 'number', default: 0 },
          offsetZ: { type: 'number', default: 0 },
          scaleOffset: { type: 'number', default: 1 }
        },
        
        init: function() {
          this.frames = [];
          this.currentFrame = 0;
          this.frameTime = 1000 / this.data.fps;
          this.elapsedTime = 0;
          this.isLoading = true;
          
          // Load all frames dynamically
          this.loadFrames();
        },
        
        loadFrames: function() {
          const container = this.el;
          
          for (let i = 0; i < this.data.totalFrames; i++) {
            // Format frame number with leading zeros (0000, 0001, etc.)
            const frameNum = i.toString().padStart(4, '0');
            const framePath = `${this.data.folderPath}${this.data.framePrefix}${frameNum}.glb`;
            
            // Create entity for this frame
            const frameEntity = document.createElement('a-entity');
            frameEntity.setAttribute('gltf-model', framePath);
            frameEntity.setAttribute('visible', i === 0); // Only first frame visible
            frameEntity.setAttribute('fix-materials', '');
            frameEntity.classList.add('anim-frame');
            
            container.appendChild(frameEntity);
            this.frames.push(frameEntity);
          }
          
          this.isLoading = false;
          console.log(`Loaded ${this.data.totalFrames} animation frames`);
        },
        
        tick: function(time, deltaTime) {
          if (this.isLoading || this.frames.length === 0) return;
          
          this.elapsedTime += deltaTime;
          
          if (this.elapsedTime >= this.frameTime) {
            // Hide current frame
            this.frames[this.currentFrame].setAttribute('visible', false);
            
            // Move to next frame (loop back to 0 after last frame)
            this.currentFrame = (this.currentFrame + 1) % this.frames.length;
            
            // Show next frame
            this.frames[this.currentFrame].setAttribute('visible', true);
            
            // Reset elapsed time
            this.elapsedTime = 0;
          }
        }
      });

      // Component to render only inside faces (inverted normals)
      AFRAME.registerComponent('fix-materials', {
        init: function() {
          this.el.addEventListener('model-loaded', () => {
            this.el.object3D.traverse((node) => {
              if (node.isMesh && node.material) {
                // Force front-side rendering only (hide inverted normals)
                node.material.side = THREE.FrontSide;
                node.material.needsUpdate = true;
              }
            });
          });
        }
      });

      // Splash screen functionality
      document.addEventListener('DOMContentLoaded', function() {
        const startButton = document.getElementById('start-button');
        const splashScreen = document.getElementById('splash-screen');
        const logo = document.getElementById('logo');
        const model = document.querySelector('#model');
        const animatedFrames = document.querySelector('#animated-frames');
        
        startButton.addEventListener('click', function() {
          // Add opening animation class
          splashScreen.classList.add('opening');
          
          // Start all train animations
          const trainModels = document.querySelectorAll('.train-model');
          trainModels.forEach(model => {
            const mixer = model.getAttribute('animation-mixer');
            if (mixer) {
              model.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 1');
            }
          });
          
          // Remove splash screen after animation completes
          setTimeout(() => {
            splashScreen.classList.add('hidden');
            splashScreen.style.display = 'none';
            
            // Show logo after curtains open
            setTimeout(() => {
              logo.classList.add('visible');
            }, 200);
          }, 1800);
        });

        if (model) {
          model.setAttribute('follow-camera-rotation', '');
          model.setAttribute('pinch-zoom', '');
        }
        
        if (animatedFrames) {
          animatedFrames.setAttribute('frame-animator', 'fps: 30; totalFrames: 30');
        }

      });

    </script>

  </body>
</html>
